<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nút Tỏa</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f9f9f9;
    }

    .btn-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 20px;
    }

    /* Vòng tỏa */
    .btn-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(0, 123, 255, 0.3); /* màu tỏa */
      transform: translate(-50%, -50%);
      animation: pulse 2s infinite;
    }

    /* Nút chính */
    .btn {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0084ff; /* màu nút */
      color: white;
      font-weight: bold;
      font-family: sans-serif;
      z-index: 1;
    }

    /* Hiệu ứng tỏa */
    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.6;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.8);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="btn-wrap">
    <div class="btn">Zalo</div>
  </div>
  <div class="btn-wrap" style="--color:#ff4d4d;">
    <div class="btn" style="background:#ff4d4d;">📞</div>
  </div>
</body>
</html>
